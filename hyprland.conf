$activeBorderColor   = rgb(9FB0B4)
$inactiveBorderColor = rgb(283638)

general {
    col.active_border   = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

decoration {
    # macOS-style corners: a generous radius plus a squircle curve.
    # rounding_power above 2.0 makes the corner superelliptic rather than a
    # circular arc, which is what distinguishes macOS rounding from a plain
    # rounded rectangle. Delete this block for square windows.
    rounding = 12
    rounding_power = 3.0
}

group {
    col.border_active   = $activeBorderColor
    col.border_inactive = $inactiveBorderColor

    groupbar {
        # Keep group tabs in line with the window rounding
        gradient_rounding = 8
        gradient_round_only_edges = true
    }
}
