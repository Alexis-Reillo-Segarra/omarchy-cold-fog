mode = "dark"

# UI colors
accent = "#9FB0B4"
cursor = "#D8E2E4"

# Hyprland window borders. Omarchy 4 renders hypr/looknfeel from these keys;
# without them the inactive border falls back to Hyprland's grey rgba(595959aa).
hyprland_active_border = "rgb(9FB0B4)"
hyprland_inactive_border = "rgb(283638)"

# Primary colors
foreground = "#C4D0D2"
background = "#10171A"

# Selection colors
selection_foreground = "#DDE6E8"
selection_background = "#2A383C"

# Normal colors (ANSI 0-7)
color0 = "#1B2427"
color1 = "#A96B62"
color2 = "#8FA894"
color3 = "#BFAE87"
color4 = "#7E96A6"
color5 = "#9A8B9E"
color6 = "#8AA8A9"
color7 = "#C4D0D2"

# Bright colors (ANSI 8-15)
color8 = "#4A585C"
color9 = "#C2857A"
color10 = "#A8C0AC"
color11 = "#D6C6A0"
color12 = "#9BB2C2"
color13 = "#B4A4B8"
color14 = "#A6C2C3"
color15 = "#E4ECEE"
